<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>TR-1um GDS Viewer</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
    <style>
      body {
        margin: 0;
        background: #202020;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
        font-size: 12px;
      }

      .textShadow {
        text-shadow:
          -1px -1px 0 #202020,
          0 -1px 0 #202020,
          1px -1px 0 #202020,
          1px 0 0 #202020,
          1px 1px 0 #202020,
          0 1px 0 #202020,
          -1px 1px 0 #202020,
          -1px 0 0 #202020;
      }

      #loadingStatus {
        color: #dce8ff;
        min-height: 1.4em;
        overflow-wrap: anywhere;
      }

      #loadPanel {
        position: absolute;
        z-index: 3;
        top: 12px;
        left: 12px;
        box-sizing: border-box;
        width: min(440px, calc(100vw - 330px));
        min-width: 250px;
        padding: 12px;
        background: rgba(12, 17, 28, 0.92);
        border: 1px solid #60708d;
        border-radius: 8px;
        color: white;
      }
      #languagePicker {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      #loadPanel summary {
        cursor: pointer;
        font-size: 17px;
        margin: 0 0 8px;
      }
      #loadPanel p {
        margin: 5px 0;
        color: #c5d0df;
      }
      #dropZone {
        border: 2px dashed #8193af;
        border-radius: 6px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
      }
      #loadPanel.dragover {
        border-color: #fff;
        background: #31415d;
      }
      #urlForm,
      #presetPicker {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      #urlInput,
      #presetSelect {
        flex: 1;
        min-width: 0;
        padding: 7px;
      }
      #loadPanel button {
        cursor: pointer;
      }
      #sampleButton {
        background: none;
        border: 0;
        color: #a7d1ff;
        padding: 0;
      }
      #importSummary {
        color: #dce8ff;
      }
      @media (max-width: 850px) {
        #loadPanel {
          left: 8px;
          transform: none;
          top: 12px;
          width: calc(100vw - 345px);
        }
      }

      #crossSection {
        position: absolute;
        bottom: 0;
        left: 0;
        margin-left: 10px;
        margin-bottom: 10px;
      }

      #instanceClassTitle {
        font-size: large;
      }

      #information {
        font-size: small;
      }

      .layer-pattern-swatch {
        display: inline-block;
        width: 22px;
        height: 16px;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid #ffffff38;
        border-radius: 2px;
      }

      .lil-gui {
        /* --folder-ident: 4; */
        --background-color: #181818;
        /* --widget-color: rgb(0, 89, 134); */
        /* --padding: 2px; */
        --width: 300px;
        /* --name-width: 65%; */
      }
      html .lil-gui .children:empty::before {
        content: var(--gui-empty-label, '未読み込み');
      }

      .selection_link {
        pointer-events: auto;
      }

      .selection_link a {
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="crossSection"></div>
    <section id="loadPanel" aria-label="GDS読み込み" data-i18n-aria="GDS input">
      <div id="languagePicker">
        <label for="languageSelect" data-i18n="Language">言語</label>
        <select id="languageSelect">
          <option value="ja" selected>日本語</option>
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
        </select>
      </div>
      <details id="importControls" open>
        <summary>TR-1um GDS Viewer · <span data-i18n="Open GDS">GDSを開く</span></summary>
        <label for="presetSelect" data-i18n="MPW preset">MPWプリセット</label>
        <div id="presetPicker">
          <select id="presetSelect">
            <option value="" data-i18n="Select a chip…">チップを選択…</option>
          </select>
        </div>
        <div
          id="dropZone"
          role="button"
          tabindex="0"
          data-i18n="Drop a GDS file here or click to select"
        >
          GDSファイルをドロップ、またはクリックして選択
        </div>
        <form id="urlForm">
          <input
            id="urlInput"
            type="url"
            placeholder="https://…/design.gds"
            aria-label="GDSファイルのURL"
            data-i18n-aria="GDS file URL"
            required
          />
          <button type="submit" data-i18n="Load URL">URLから読込</button>
        </form>
        <button id="sampleButton" type="button" data-i18n="Load OpenSUSI sample">
          OpenSUSIのサンプルを開く
        </button>
      </details>
      <p id="loadingStatus" role="status"></p>
      <p id="importSummary"></p>
      <p data-i18n="Drawing layers only · illustrative 3D heights">
        描画レイヤーのみ表示・高さは模式値
      </p>
    </section>

    <div style="position: absolute; color: white; left: 5px; bottom: 5px; pointer-events: none">
      <div id="instanceClassTitle" class="textShadow">デザイン</div>
      <div id="information" class="textShadow"></div>
      <div class="textShadow">
        <br /><span data-i18n="KEYS">キー操作</span> <br /><span data-i18n="key1"
          >1: フィラー・デカップリング・タップセルの表示切替</span
        >
        <br /><span data-i18n="key2">2: トップセルの図形の表示切替</span> <br /><span
          data-i18n="key3"
          >3: 選択部分のみ表示／戻る</span
        >
        <br /><span data-i18n="key4">4: 選択部分を拡大</span>
      </div>
    </div>

    <script type="module" src="src/viewer.js"></script>
  </body>
</html>
