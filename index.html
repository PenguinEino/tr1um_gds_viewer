<!doctype html>
<!-- Modified by PenguinEino for TR-1um GDS Viewer (2026); based on Tiny Tapeout GDS Viewer. See NOTICE and LICENSE. -->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>TR-1um GDS Viewer</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
    <style>
      body {
        margin: 0;
        background: #202020;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
        font-size: 12px;
      }

      .textShadow {
        text-shadow:
          -1px -1px 0 #202020,
          0 -1px 0 #202020,
          1px -1px 0 #202020,
          1px 0 0 #202020,
          1px 1px 0 #202020,
          0 1px 0 #202020,
          -1px 1px 0 #202020,
          -1px 0 0 #202020;
      }

      #crossSection {
        position: absolute;
        bottom: 0;
        left: 0;
        margin-left: 10px;
        margin-bottom: 10px;
      }

      #instanceClassTitle {
        font-size: large;
      }

      #information {
        font-size: small;
      }

      .layer-pattern-swatch {
        display: inline-block;
        width: 22px;
        height: 16px;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid #ffffff38;
        border-radius: 2px;
      }

      .lil-gui {
        /* --folder-ident: 4; */
        --background-color: #181818;
        /* --widget-color: rgb(0, 89, 134); */
        /* --padding: 2px; */
        --width: 300px;
        /* --name-width: 65%; */
      }
      html .lil-gui .children:empty::before {
        content: var(--gui-empty-label, '未読み込み');
      }

      .selection_link {
        pointer-events: auto;
      }

      .selection_link a {
        color: white;
        cursor: pointer;
      }
      #communityLinks {
        position: fixed;
        right: 14px;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid #ffffff26;
        border-radius: 10px;
        background: rgba(18, 22, 29, 0.94);
      }
      #communityLinks a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        color: #c5d0df;
        text-decoration: none;
      }
      #communityLinks a:hover {
        background: #ffffff18;
      }
      #communityLinks a:focus-visible {
        outline: 2px solid #a7d1ff;
        outline-offset: 2px;
      }
      #communityLinks img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      #communityLinks .mono-icon {
        filter: invert(1);
      }
      #communityLinks .ishi-icon {
        width: 30px;
        height: 30px;
        border-radius: 4px;
      }
      #communityLinks .opensusi-link {
        width: 48px;
      }
      #communityLinks .opensusi-icon {
        width: 44px;
        height: 30px;
        border-radius: 3px;
      }
      #communityLinks .license-link {
        width: auto;
        padding: 0 6px;
        font-size: 11px;
      }
      html .lil-gui.root {
        max-height: calc(100dvh - 76px);
      }
    </style>
    <link rel="stylesheet" href="src/gallery.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div id="crossSection"></div>
    <aside id="loadPanel" aria-label="プリセット" data-i18n-aria="Presets">
      <header class="sidebar-head">
        <div class="sidebar-brand">
          <h1>TR-1um<span>GDS VIEWER</span></h1>
          <select id="languageSelect" aria-label="言語" data-i18n-aria="Language">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </div>
        <div class="import-actions">
          <button id="dropZone" type="button" data-i18n="Open file">ファイルを開く</button>
          <button
            id="urlToggle"
            type="button"
            aria-expanded="false"
            aria-controls="urlForm"
            data-i18n="Open URL"
          >
            URLから開く
          </button>
        </div>
        <form id="urlForm" hidden>
          <input
            id="urlInput"
            type="url"
            placeholder="https://…/design.gds"
            aria-label="GDSファイルのURL"
            data-i18n-aria="GDS file URL"
            required
          />
          <button type="submit" data-i18n="Open">開く</button>
        </form>
        <p id="loadingStatus" role="status"></p>
      </header>
      <div class="preset-tools">
        <div class="preset-title">
          <h2 data-i18n="Presets">プリセット</h2>
          <span id="presetCount">37</span
          ><a
            href="https://github.com/ishi-kai/ISHI-KAI_Multiple_Projects_OpenMPW_OpenSUSI-TR10-1"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="Project index"
            >プロジェクト一覧 ↗</a
          >
        </div>
        <input
          id="presetSearch"
          type="search"
          placeholder="チップ・回路・名前で検索"
          data-i18n-placeholder="Search presets"
          aria-label="プリセットを検索"
          data-i18n-aria="Search presets"
        />
      </div>
      <div id="presetList"></div>
      <p id="presetEmpty" hidden data-i18n="No presets found">一致するプリセットがありません</p>
    </aside>
    <button
      id="togglePresets"
      type="button"
      aria-controls="loadPanel"
      aria-expanded="true"
      aria-label="プリセット一覧の表示切替"
      data-i18n-aria="Toggle presets"
    >
      ‹
    </button>
    <div id="designInfo">
      <div id="instanceClassTitle" class="textShadow"></div>
      <div id="information" class="textShadow"></div>
      <details id="keyboardHelp" class="textShadow">
        <summary data-i18n="KEYS">キー操作</summary>
        <div data-i18n="key1"></div>
        <div data-i18n="key2"></div>
        <div data-i18n="key3"></div>
        <div data-i18n="key4"></div>
      </details>
    </div>

    <nav id="communityLinks" aria-label="関連リンク" data-i18n-aria="Community links">
      <a
        href="https://github.com/PenguinEino/tr1um_gds_viewer"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub · ソースコード"
        data-i18n-aria="Source repository"
        title="GitHub · PenguinEino/tr1um_gds_viewer"
      >
        <img class="mono-icon" src="icons/github.svg" alt="" />
      </a>
      <a
        href="https://x.com/Penguininin_"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X · @Penguininin_"
        title="X · @Penguininin_"
      >
        <img class="mono-icon" src="icons/x.svg" alt="" />
      </a>
      <a
        href="https://ishi-kai.org/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ISHI会"
        title="ISHI会"
      >
        <img
          class="ishi-icon"
          src="https://ishi-kai.org/assets/images/ishikai_icon.png"
          referrerpolicy="no-referrer"
          alt=""
        />
      </a>
      <a
        class="opensusi-link"
        href="https://www.opensusi.org/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="OpenSUSI"
        title="OpenSUSI"
      >
        <img
          class="opensusi-icon"
          src="https://static.wixstatic.com/media/ddfa79_802e51c57efe47e79cb0cc1e949ab23a~mv2.png/v1/fill/w_1200,h_630,al_c/ddfa79_802e51c57efe47e79cb0cc1e949ab23a~mv2.png"
          referrerpolicy="no-referrer"
          alt=""
        />
      </a>
      <a
        href="https://discord.gg/Sj47dJk8x7"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ISHI会 Discord"
        title="ISHI会 Discord"
      >
        <img class="mono-icon" src="icons/discord.svg" alt="" />
      </a>
      <a
        class="license-link"
        href="https://github.com/PenguinEino/tr1um_gds_viewer/blob/main/LICENSE"
        target="_blank"
        rel="noopener noreferrer"
        >License</a
      >
    </nav>

    <script type="module" src="src/viewer.js"></script>
  </body>
</html>
