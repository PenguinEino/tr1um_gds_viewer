<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TR-1um GDS Viewer</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
    <style>
      body {
        margin: 0;
        background: #202020;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
        font-size: 12px;
      }

      .textShadow {
        text-shadow:
          -1px -1px 0 #202020,
          0 -1px 0 #202020,
          1px -1px 0 #202020,
          1px 0 0 #202020,
          1px 1px 0 #202020,
          0 1px 0 #202020,
          -1px 1px 0 #202020,
          -1px 0 0 #202020;
      }

      #loadingStatus {
        color: #dce8ff;
        min-height: 1.4em;
        overflow-wrap: anywhere;
      }

      #loadPanel {
        position: absolute;
        z-index: 3;
        top: 12px;
        left: 12px;
        box-sizing: border-box;
        width: min(440px, calc(100vw - 330px));
        min-width: 250px;
        padding: 12px;
        background: rgba(12, 17, 28, 0.92);
        border: 1px solid #60708d;
        border-radius: 8px;
        color: white;
      }
      #loadPanel summary {
        cursor: pointer;
        font-size: 17px;
        margin: 0 0 8px;
      }
      #loadPanel p {
        margin: 5px 0;
        color: #c5d0df;
      }
      #dropZone {
        border: 2px dashed #8193af;
        border-radius: 6px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
      }
      #loadPanel.dragover {
        border-color: #fff;
        background: #31415d;
      }
      #urlForm {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      #urlInput {
        flex: 1;
        min-width: 0;
        padding: 7px;
      }
      #loadPanel button {
        cursor: pointer;
      }
      #sampleButton {
        background: none;
        border: 0;
        color: #a7d1ff;
        padding: 0;
      }
      #importSummary {
        color: #dce8ff;
      }
      @media (max-width: 850px) {
        #loadPanel {
          left: 8px;
          transform: none;
          top: 12px;
          width: calc(100vw - 345px);
        }
      }

      #crossSection {
        position: absolute;
        bottom: 0;
        left: 0;
        margin-left: 10px;
        margin-bottom: 10px;
      }

      #instanceClassTitle {
        font-size: large;
      }

      #information {
        font-size: small;
      }

      .layer-pattern-swatch {
        display: inline-block;
        width: 22px;
        height: 16px;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid #ffffff38;
        border-radius: 2px;
      }

      .lil-gui {
        /* --folder-ident: 4; */
        --background-color: #181818;
        /* --widget-color: rgb(0, 89, 134); */
        /* --padding: 2px; */
        --width: 300px;
        /* --name-width: 65%; */
      }

      .selection_link {
        pointer-events: auto;
      }

      .selection_link a {
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="crossSection"></div>
    <section id="loadPanel" aria-label="GDS input">
      <details id="importControls" open>
        <summary>TR-1um GDS Viewer · Open GDS</summary>
        <div id="dropZone" role="button" tabindex="0">Drop a GDS file here or click to select</div>
        <form id="urlForm">
          <input
            id="urlInput"
            type="url"
            placeholder="https://…/design.gds"
            aria-label="GDS file URL"
            required
          />
          <button type="submit">Load URL</button>
        </form>
        <button id="sampleButton" type="button">Load OpenSUSI sample</button>
      </details>
      <p id="loadingStatus" role="status"></p>
      <p id="importSummary"></p>
      <p>Drawing layers only · illustrative 3D heights</p>
    </section>

    <div style="position: absolute; color: white; left: 5px; bottom: 5px; pointer-events: none">
      <div id="instanceClassTitle" class="textShadow">DESIGN</div>
      <div id="information" class="textShadow"></div>
      <div class="textShadow">
        <br />KEYS <br />1: Hide Fill, Decap, Tap cells <br />2: Hide top cell geometry <br />3:
        Isolate selection / back <br />4: Zoom to selection
      </div>
    </div>

    <script type="module" src="src/viewer.js"></script>
  </body>
</html>
